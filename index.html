<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
<form>

    <div class="container">

        <div class="form-box">

            <!-- Header -->
            <div class="form-header">
                <h2>Job Application Form</h2>
                <p>Please fill in your details carefully before submitting.</p>
            </div>


            <!-- 1. Personal Information -->
            <div class="section personal-section">

                <h3>1. Personal Information</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" placeholder="Enter your name" class="name-input">
                        <div class="name-error error"></div>
                    </div>


                    <div class="form-group">
                        <label>Mobile Number *</label>
                        <input
                            type="text"
                            inputmode="numeric"
                            placeholder="10-digit mobile number"
                            class="mobile-input"
                        >
                        <div class="mobile-error error"></div>
                    </div>


                    <div class="form-group">
                        <label>Email Address *</label>
                        <input
                            type="email"
                            placeholder="example@email.com"
                            class="email-input"
                        >
                        <div class="email-error error"></div>
                    </div>


                    <div class="form-group">
                        <label>Aadhaar Number *</label>
                        <input
                            type="text"
                            inputmode="numeric"
                            placeholder="12-digit Aadhaar number"
                            class="aadhaar-input"
                        >
                        <div class="aadhaar-error error"></div>
                    </div>


                    <div class="form-group">
                        <label>PAN Number *</label>
                        <input
                            type="text"
                            placeholder="ABCDE1234F"
                            class="pan-input"
                        >
                        <div class="pan-error error"></div>
                    </div>


                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="date" class="date-input">
                        <div class="date-error error"></div>
                    </div>


                    <div class="form-group full-width">

                        <label>Gender *</label>

                        <div class="choices">

                            <label>
                                <input type="radio" name="gender">
                                Male
                            </label>

                            <label>
                                <input type="radio" name="gender">
                                Female
                            </label>

                            <label>
                                <input type="radio" name="gender">
                                Other
                            </label>

                        </div>

                        <div class="gender-error error"></div>

                    </div>

                </div>

            </div>


            <!-- 2. Address -->
            <div class="section">

                <h3>2. Address</h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label>State *</label>

                        <select class="state">
                            <option value="">Select State</option>
                            <option value="up">Uttar Pradesh</option>
                            <option value="mp">madhya pradesh</option>
                            <option value="maharastra">Maharashtra</option>
                        </select>

                        <div class="state-error error"></div>

                    </div>


                    <div class="form-group">

                        <label>City *</label>

                        <select class="city">
                            <option value="">Select City</option>
                        </select>

                        <div class="city-error error"></div>

                    </div>

                    <div class="form-group full-width">

                        <label>Address *</label>

                        <textarea
                            class="address-input"
                            placeholder="Enter your complete address"
                        ></textarea>

                        <div class="address-error error"></div>

                        <div class="hint">
                            Keep address within the allowed character limit.
                        </div>

                    </div>

                </div>

            </div>


            <!-- 3. Education -->
            <div class="section">

                <h3>3. Education</h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Qualification *</label>

                        <select class="qualification">

                            <option value="">
                                Select Qualification
                            </option>

                            <option value="inter">12th</option>
                            <option value="diploma">Diploma</option>
                            <option value="graduation">Graduation</option>

                        </select>

                        <div class="qualification-error error"></div>

                    </div>


                    <div class="form-group">

                        <label>Course *</label>

                        <select class="course">

                            <option value="">
                                Select Course
                            </option>

                        </select>

                        <div class="course-error error"></div>

                    </div>


                    <div class="form-group">

                        <label>Passing Year *</label>

                        <input
                          type="number"
                          placeholder="2026"
                          class="passing-year-input"
                        >

                        <div class="passing-year-error error"></div>

                    </div>



                    <div class="form-group">

                        <label>Percentage / CGPA *</label>

                        <input
                            type="number"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="0 - 100"
                        >

                    </div>

                </div>

            </div>


            <!-- 4. Experience & Skills -->
            <div class="section">

                <h3>4. Experience & Skills</h3>

                <div class="form-grid">

                    <!-- Experience -->
                    <div class="form-group full-width">

                        <label>Work Experience *</label>

                        <div class="choices experience">

                            <label>
                                <input type="radio" name="experience">
                                Fresher
                            </label>

                            <label>
                                <input type="radio" name="experience">
                                0–1 Years
                            </label>

                            <label>
                                <input type="radio" name="experience">
                                1–3 Years
                            </label>

                            <label>
                                <input type="radio" name="experience">
                                3–5 Years
                            </label>

                            <label>
                                <input type="radio" name="experience">
                                More than 5 Years
                            </label>

                        </div>

                        <div class="experience-error error"></div>

                    </div>


                    <!-- Skills -->
                    <div class="form-group">

                        <label>
                            Skills * (select at least 2)
                        </label>

                        <div class="choices checkbox-list">

                            <label>
                                <input type="checkbox" name="skills">
                                HTML
                            </label>

                            <label>
                                <input type="checkbox" name="skills">
                                CSS
                            </label>

                            <label>
                                <input type="checkbox" name="skills">
                                JavaScript
                            </label>

                            <label>
                                <input type="checkbox" name="skills">
                                React
                            </label>

                        </div>
                        <div class="skills-error error"></div>
                    </div>


                    <!-- Hobbies -->
                    <div class="form-group">

                        <label>
                            Hobbies * (select at least 1)
                        </label>

                        <div class="choices checkbox-list">

                            <label>
                                <input type="checkbox" name="hobbies">
                                Coding
                            </label>

                            <label>
                                <input type="checkbox" name="hobbies">
                                Sports
                            </label>

                            <label>
                                <input type="checkbox" name="hobbies">
                                Music
                            </label>

                            <label>
                                <input type="checkbox" name="hobbies">
                                Reading
                            </label>

                        </div>

                        <div class="hobbies-error error"></div>

                </div>

            </div>


            <!-- 5. Documents -->
            <div class="section">

                <h3>5. Documents</h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Profile Photograph *</label>

                        <input
                            type="file"
                            accept=".jpg,.jpeg,.png"
                            class="photo-input"
                        >

                        <div class="hint">
                            JPG, JPEG or PNG · Maximum 2 MB
                        </div>

                        <div class="photo-error error"></div>

                    </div>


                    <div class="form-group">

                        <label>Resume / CV *</label>

                        <input
                            type="file"
                            class="resume-input"
                            accept=".pdf,.doc,.docx"
                        >

                        <div class="hint">
                            PDF, DOC or DOCX · Maximum 5 MB
                        </div>

                        <div class="resume-error error"></div>

                </div>

            </div>


            <!-- Declaration -->
            <div class="section declaration-section">

                <label class="declaration">

                    <input type="checkbox" class="declaration-checkbox">

                    <span>
                        I declare that the information provided above
                        is correct and complete.
                    </span>

                </label>
                
                <div class="declaration-error error"></div>

                <!-- Buttons -->
                <div class="actions">

                    <button
                        type="submit"
                        class="submit-btn"
                    >    
                        Submit Application
                    </button>

                    <button
                        type="reset"
                        class="reset-btn"
                        
                    >
                        Reset Form
                    </button>

                </div>

            </div>

        </div>

    </div>

</form>


    <script src="script.js"></script>
</body>
</html>
